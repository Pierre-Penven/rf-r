[package]
name = "rf-r"
version = "0.1.0"
edition = "2024"
description = "High-performance RF and satellite link budget calculations (dB math, FSPL, C/N, flux density)"
license = "MIT"
keywords = ["rf", "satellite", "link-budget", "decibel", "telecom"]
categories = ["science", "mathematics"]

[dependencies]

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "rf_bench"
harness = false

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
lto = "fat"
codegen-units = 1
